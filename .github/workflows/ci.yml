# Continuous integration: installs, lints, tests and builds the frontend on a
# clean Linux machine, for each push to main and each pull request.
#
# What a clean machine catches that this laptop can't: a file that exists
# here but was never committed, an environment variable only set here (such
# as anything in .env, which is never committed), and anything that only
# works on Windows.
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks out the code and builds it.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going
# for the older one, since only the newest result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job's name is the status check's name ("check"). Branch protection
  # will refer to it by that name, so keep it stable.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22, the version this was developed on and the one the Docker
      # image builds with. cache: npm keeps npm's download cache between
      # runs, keyed on package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Exactly the versions in package-lock.json, installed for Linux.
      - run: npm ci

      - run: npm run lint

      # The tests use the mock API, with VITE_API_URL pinned in
      # vite.config.ts, so they need no backend.
      - run: npm test

      # Type-checks (tsc -b), then builds the production bundle.
      #
      # The build refuses to run without VITE_API_URL (vite.config.ts), and a
      # runner has no .env, which is never committed. The first CI run failed
      # here with exactly that message. The bundle is only checked, never
      # deployed, so the value is deliberately not a real address: .invalid is
      # a top-level domain reserved never to resolve (RFC 2606), so anyone who
      # finds this URL in a bundle knows it came from CI, and it can't reach
      # any server. It's set on this step only: the tests keep the /api/v1
      # that vite.config.ts pins for them.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://built-by-ci.invalid/api/v1

  # Builds the Docker image, so a broken Dockerfile, .dockerignore or
  # nginx.conf turns CI red instead of waiting for someone to run compose by
  # hand. A separate job runs in parallel with "check", so a slow image
  # build never holds up the test result; it's its own status check, "image".
  #
  # NOT COVERED, and only checked by hand (opsdesk-system PR #1 records how):
  # nothing here runs docker compose, so the three services starting
  # together, the healthchecks, the browser reaching the backend and the
  # data surviving in the volume are not tested by CI.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same .invalid address as the "check" job's build, as a build
      # argument this time. Without it the Dockerfile's build step stops on
      # vite.config.ts's check, by design.
      - name: Build the Docker image
        run: >-
          docker build
          --build-arg VITE_API_URL=https://built-by-ci.invalid/api/v1
          -t opsdesk-frontend:ci .

      # docker build only COPIES nginx.conf: nginx reads it when it starts,
      # so a config with a syntax error builds green (measured: a missing
      # semicolon built with exit 0). nginx -t is nginx's own config test,
      # run inside the image just built.
      - name: Test the nginx config inside the image
        run: docker run --rm opsdesk-frontend:ci nginx -t
