# nginx inside the frontend image: serves the built app (dist/) and nothing
# else. The Dockerfile copies this over nginx's default site config.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app's pages (/tickets/12, /dashboard, ...) exist only inside the
    # JavaScript router; there's no file at those paths. A refresh or a link
    # opened directly asks nginx for that file, and without this line nginx
    # answers with its own 404 page. try_files serves the file if it exists,
    # then a folder of that name, and otherwise index.html, which loads the
    # app and lets the router show the page (or the app's own "not found").
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS and CSS, named by content hash. A missing one must be a real
    # 404: answering index.html with 200 instead would hand the browser an
    # HTML page where it expects a script, and the failure would be harder to
    # see. Hashed names never change content, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
